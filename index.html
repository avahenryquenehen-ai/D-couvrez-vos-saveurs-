<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background-color: #c7f0d1; /* vert pastel */
    color: white;
    text-align: center;
    overflow-x: hidden;
  }
  h1 {
    font-size: 2.5rem;
    margin: 2rem 0;
  }
  .container {
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    margin: 2rem;
  }
  .block {
    background-color: rgba(0,0,0,0.2);
    border-radius: 15px;
    padding: 1rem;
    width: 250px;
    cursor: pointer;
    transition: transform 0.3s;
  }
  .block:hover {
    transform: scale(1.05);
  }
  .block img {
    width: 100%;
    border-radius: 10px;
  }
  .liquid-img {
    width: 300px;
    border-radius: 15px;
    margin: 2rem 0;
    transition: opacity 0.5s;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 2rem;
  }
  button {
    background-color: white;
    color: #2e7d32;
    border: none;
    padding: 1rem 2rem;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  button:hover {
    background-color: #a5d6a7;
  }
  .hidden {
    display: none;
  }
  .page {
    opacity: 1;
    transition: opacity 0.5s;
  }
  .fade-out {
    opacity: 0;
  }
</style>
</head>
<body>

<!-- PAGE 1 : Choix de la catégorie avec images stables -->
<div id="page1" class="page">
  <h1>Découvrez vos saveurs</h1>
  <div class="container">
    <div class="block" onclick="selectCategory('Fruités')">
      <h2>Fruités</h2>
      <img src="https://m.media-amazon.com/images/I/61LpPOxwDzL._AC_SL1024_.jpg" alt="Fruits">
    </div>
    <div class="block" onclick="selectCategory('Gourmands')">
      <h2>Gourmands</h2>
      <img src="https://m.media-amazon.com/images/I/81Hdo7hswqL._AC_SX679_.jpg" alt="Desserts">
    </div>
    <div class="block" onclick="selectCategory('Tabacs')">
      <h2>Tabacs</h2>
      <img src="https://m.media-amazon.com/images/I/816e73QOV1L._AC_SL1500_.jpg" alt="Tabac">
    </div>
  </div>
</div>

<!-- PAGE 2 : Affichage d'un liquide aléatoire -->
<div id="page2" class="page hidden">
  <h1 id="liquid-name"></h1>
  <img id="liquid-img" class="liquid-img" src="" alt="Liquide">
  <div class="buttons">
    <button onclick="like()">J'aime</button>
    <button onclick="nextLiquid()">Découvrir un autre</button>
  </div>
</div>

  let currentCategory = '';
  let currentLiquidIndex = 0;

  function selectCategory(category) {
    currentCategory = category;
    currentLiquidIndex = Math.floor(Math.random() * liquids[category].length);
    showPage('page2');
    displayLiquid();
  }

  function displayLiquid() {
    const liquid = liquids[currentCategory][currentLiquidIndex];
    const imgEl = document.getElementById('liquid-img');
    const nameEl = document.getElementById('liquid-name');
    imgEl.classList.add('fade-out');
    setTimeout(() => {
      imgEl.src = liquid.img;
      nameEl.textContent = liquid.name;
      imgEl.classList.remove('fade-out');
    }, 300);
  }

  function nextLiquid() {
    currentLiquidIndex = Math.floor(Math.random() * liquids[currentCategory].length);
    displayLiquid();
  }

  function like() {
    showPage('page3');
  }

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
    document.getElementById(pageId).classList.remove('hidden');
  }

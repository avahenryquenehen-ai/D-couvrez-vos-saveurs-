    .page {
        display: none;

    .blocks {

    .block {

        align-items: center;

        border-radius: 15px;
        transition: transform 0.2s;

        transform: scale(1.05);
    }

        width: 100px;
        height: 100px;
        object-fit: cover;

        border-radius: 10px;
    }

        margin-bottom: 25px;

    }

    }

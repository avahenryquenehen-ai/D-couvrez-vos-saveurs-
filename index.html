<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Découvrez vos saveurs</title>
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #A8D5BA;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 50px;
      font-size: 2.5em;
      font-weight: bold;
    }

    .page {
      display: none;
    }

    .active {
      display: block;
    }

    /* --- Blocs de la première page --- */
    .blocks {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 50px;
      gap: 30px;
    }

    .block {
      background-color: white;
      color: #4A4A4A;
      border-radius: 20px;
      width: 220px;
      height: 260px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.3s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    .block:hover {
      transform: scale(1.05);
    }

    .block img {
      width: 120px;            /* ✅ Taille fixe, plus petite */
      height: 120px;
      object-fit: cover;
      border-radius: 15px;
      margin-top: 20px;
    }

    .block p {
      font-size: 1.2em;
      margin: 15px 0 0 0;
      font-weight: bold;
    }

    /* --- Page des liquides --- */
    #liquid-img {
      width: 280px;
      height: 280px;
      object-fit: cover;
      border-radius: 20px;
      margin-top: 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      background-color: white;
      color: #4A4A4A;
      border: none;
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #F0F0F0;
    }

    /* --- Page de remerciement --- */
    .thankyou {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2em;
      line-height: 1.5em;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- PAGE 1 -->
  <div id="page1" class="page active">
    <h1>Découvrez vos saveurs</h1>
    <div class="blocks">
      <div class="block" onclick="showLiquids('fruites')">
        <img src="https://files.oaiusercontent.com/file_00000000ed5471f5bb6fae045fbc25d0?region=0,256,512,512" alt="Fruités">
        <p>Fruités</p>
      </div>
      <div class="block" onclick="showLiquids('gourmands')">
        <img src="https://files.oaiusercontent.com/file_00000000ed5471f5bb6fae045fbc25d0?region=320,256,832,768" alt="Gourmands">
        <p>Gourmands</p>
      </div>
      <div class="block" onclick="showLiquids('tabacs')">
        <img src="https://files.oaiusercontent.com/file_00000000ed5471f5bb6fae045fbc25d0?region=640,256,1152,768" alt="Tabacs">
        <p>Tabacs</p>
      </div>
    </div>
  </div>

  <!-- PAGE 2 -->
  <div id="page2" class="page">
    <h1 id="liquid-category"></h1>
    <img id="liquid-img" src="" alt="Liquid">
    <h2 id="liquid-name"></h2>
    <div class="buttons">
      <button onclick="goToThankYou()">J'aime</button>
      <button onclick="showRandomLiquid()">Découvrir un autre</button>
    </div>
  </div>

  <!-- PAGE 3 -->
  <div id="page3" class="page">
    <div class="thankyou">
      💨<br>
      Merci et à bientôt<br>
      dans votre magasin<br>
      <strong>Vapeur & Saveurs</strong>
    </div>
  </div>

  <script>
    const liquids = {
      fruites: [
        {name: "Fraise Kiwi", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/jBZV16q8fay6sQbyqL1T.jpg"},
        {name: "Mangue Goyave", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/T1O3lF4WkQZ1ZpLxYZDh.jpg"},
        {name: "Pomme Verte", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/2oV3hr2wEMk4ToFslRQJ.jpg"},
        {name: "Fruits Rouges", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/g7zv0X8pvAoPbKmpjGUb.jpg"},
        {name: "Ananas Coco", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/nY8pVvm9om2mW5rMjzjL.jpg"}
      ],
      gourmands: [
        {name: "Café Vanille", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/BJv3bZpDg9vh6cQ3e4Ce.jpg"},
        {name: "Cookie", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/Q7EEbBsj12z8jNYMpbIv.jpg"},
        {name: "Tiramisu", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/yHuhAxQbs9rNbb4S3qzE.jpg"},
        {name: "Crème Caramel", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/xUs2a6dov2iHHOaKe5Za.jpg"}
      ],
      tabacs: [
        {name: "Classic Blend", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/aooXQwgvayUyVSfk4yFS.jpg"},
        {name: "Old Jack", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/zop82tcLFUbFJQ1SN23M.jpg"},
        {name: "Classic Blond", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/Dj8GSjPSl4FrvVeS9miS.jpg"},
        {name: "Classic M", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/6Awgpf8m05KFsEINlEzI.jpg"},
        {name: "Classic Blond Miel Noir", img: "https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/H0rFrIRVXs98uXWozi27.jpg"}
      ]
    };

    let currentCategory = '';

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function showLiquids(category) {
      currentCategory = category;
      liquids[category] = shuffleArray([...liquids[category]]);
      document.getElementById('page1').classList.remove('active');
      document.getElementById('page2').classList.add('active');
      document.getElementById('liquid-category').innerText = category.charAt(0).toUpperCase() + category.slice(1);
      showRandomLiquid();
    }

    function showRandomLiquid() {
      const list = liquids[currentCategory];
      const liquid = list[Math.floor(Math.random() * list.length)];
      const img = document.getElementById('liquid-img');
      img.src = liquid.img;
      document.getElementById('liquid-name').innerText = liquid.name;
    }

    function goToThankYou() {
      document.getElementById('page2').classList.remove('active');
      document.getElementById('page3').classList.add('active');
    }
  </script>
  <script>
    // 🖼️ Ajout des images pour chaque bloc de catégorie
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelector('.block[data-category="fruites"] img').src = "https://files.oaiusercontent.com/file-00000000ed5471f5bb6fae045fbc25d0?table=block&spaceId="; // ton image fruits
        document.querySelector('.block[data-category="gourmands"] img').src = "https://files.oaiusercontent.com/file-00000000ed5471f5bb6fae045fbc25d0?table=block&spaceId="; // ton image gourmande
        document.querySelector('.block[data-category="tabacs"] img').src = "https://files.oaiusercontent.com/file-00000000ed5471f5bb6fae045fbc25d0?table=block&spaceId="; // ton image tabac
    });
</script>

</body>
</html>

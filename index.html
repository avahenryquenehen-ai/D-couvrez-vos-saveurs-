<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vapeur & Saveurs</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background-color: #c7f0d1; /* vert pastel */
    color: white;
    text-align: center;
    overflow-x: hidden;
  }
  h1 {
    font-size: 2.5rem;
    margin: 2rem 0;
  }
  .container {
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    margin: 2rem;
  }
  .block {
    background-color: rgba(0,0,0,0.2);
    border-radius: 15px;
    padding: 1rem;
    width: 250px;
    cursor: pointer;
    transition: transform 0.3s;
  }
  .block:hover {
    transform: scale(1.05);
  }
  .block img {
    width: 100%;
    border-radius: 10px;
  }
  .liquid-img {
    width: 300px;
    border-radius: 15px;
    margin: 2rem 0;
    transition: opacity 0.5s;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 2rem;
  }
  button {
    background-color: white;
    color: #2e7d32;
    border: none;
    padding: 1rem 2rem;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  button:hover {
    background-color: #a5d6a7;
  }
  .hidden {
    display: none;
  }
  .page {
    opacity: 1;
    transition: opacity 0.5s;
  }
  .fade-out {
    opacity: 0;
  }
</style>
</head>
<body>

<!-- PAGE 1 : Choix de la catégorie avec images stables -->
<div id="page1" class="page">
  <h1>Découvrez vos saveurs</h1>
  <div class="container">
    <div class="block" onclick="selectCategory('Fruités')">
      <h2>Fruités</h2>
      <img src="https://i.ibb.co/6t3BqzF/fruits.jpg" alt="Fruits">
    </div>
    <div class="block" onclick="selectCategory('Gourmands')">
      <h2>Gourmands</h2>
      <img src="https://i.ibb.co/kX8zV4F/desserts.jpg" alt="Desserts">
    </div>
    <div class="block" onclick="selectCategory('Tabacs')">
      <h2>Tabacs</h2>
      <img src="https://i.ibb.co/5xYVQGr/tabac.jpg" alt="Tabac">
    </div>
  </div>
</div>

<!-- PAGE 2 : Affichage d'un liquide aléatoire -->
<div id="page2" class="page hidden">
  <h1 id="liquid-name"></h1>
  <img id="liquid-img" class="liquid-img" src="" alt="Liquide">
  <div class="buttons">
    <button onclick="like()">J'aime</button>
    <button onclick="nextLiquid()">Découvrir un autre</button>
  </div>
</div>

<!-- PAGE 3 : Merci -->
<div id="page3" class="page hidden">
  <h1>Merci et à bientôt dans votre magasin Vapeur & Saveurs 💨</h1>
</div>

<script>
  const liquids = {
    "Fruités": [
      {name:"Fraise, Pitaya", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/jNBO2uKExDrUZRyYQ5S6.jpg"},
      {name:"Framboise, Cassis, FRAIS", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/CntTgf208Kr2Pf5KAzUH.jpg"},
      {name:"Grenadine, Framboise, FRAIS", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/vwQHuIrn12i0gO5tdmLy.jpg"},
      {name:"Fraise des bois, Cerise", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/gHuFIWZeDNVTVCpSMQDU.jpg"},
      {name:"Fruits des bois, FRAIS", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/FtP4KzgBi3h53NQwTPcg.jpg"},
      {name:"Mûre, Litchi, FRAIS", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/3KS7k7bUbIm834cYN1qn.jpg"},
      {name:"Fruits rouges", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/gQv38iG8WBNvr5wIyHNp.jpg"},
      {name:"Poire, Mangue", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/kHokWuQn3NK1vm4kS4KH.jpg"},
      {name:"Banane, Fraise, Rétro", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/EZNhu33GbBHSYm2Ea7vV.jpg"},
      {name:"Cassis, Fleurs de cerisier, FRAIS", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/XqI2F5af3Q4VFoQzU6BZ.jpg"}
      // … tu peux continuer avec tous les liquides Fruités
    ],
    "Gourmands": [
      {name:"Cake noisettes", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/VpmZu8AzHguPtgFW9OCT.jpg"},
      {name:"Mousse Chocolat Blanc, Noisettes", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/HECvZawlR2DXRY0JbosP.jpg"},
      {name:"Éclair Vanille", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/0HBQp6xBpCMz0W27CtkN.jpg"}
      // … tu peux continuer avec tous les liquides Gourmands
    ],
    "Tabacs": [
      {name:"Mrs O'neil", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/sxxpMpSi8vEVjoKmqatA.jpg"},
      {name:"Kiddy James", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/aooXQwgvayUyVSfk4yFS.jpg"},
      {name:"Old Jack", img:"https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/3ttAFprW0MIEfdbZs1va/pub/zop82tcLFUbFJQ1SN23M.jpg"}
      // … tu peux continuer avec tous les liquides Tabacs
    ]
  };

  let currentCategory = '';
  let currentLiquidIndex = 0;

  function selectCategory(category) {
    currentCategory = category;
    currentLiquidIndex = Math.floor(Math.random() * liquids[category].length);
    showPage('page2');
    displayLiquid();
  }

  function displayLiquid() {
    const liquid = liquids[currentCategory][currentLiquidIndex];
    const imgEl = document.getElementById('liquid-img');
    const nameEl = document.getElementById('liquid-name');
    imgEl.classList.add('fade-out');
    setTimeout(() => {
      imgEl.src = liquid.img;
      nameEl.textContent = liquid.name;
      imgEl.classList.remove('fade-out');
    }, 300);
  }

  function nextLiquid() {
    currentLiquidIndex = Math.floor(Math.random() * liquids[currentCategory].length);
    displayLiquid();
  }

  function like() {
    showPage('page3');
  }

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
    document.getElementById(pageId).classList.remove('hidden');
  }
</script>

</body>
</html>
